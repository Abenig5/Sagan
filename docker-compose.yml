services:
  db:
    image: postgres:16
    container_name: sagan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sagan
      POSTGRES_PASSWORD: sagan
      POSTGRES_DB: sagan_beauty
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sagan -d sagan_beauty"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
